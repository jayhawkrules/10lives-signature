<!doctype html>
<meta charset="utf-8">
<title>Make social icons</title>
<!-- Regenerates assets/icons/*.png (96x96). Same drawing as drawIcon() in index.html: a white plate
     baked into the pixels around the dark tile, so the icons read on white AND on a dark Gmail
     screen (Gmail's dark mode recolours HTML backgrounds but leaves image pixels alone).
     Open in Chrome; each icon shows with a Download link. -->
<body style="font:14px sans-serif;background:#888">
<div id="out"></div>
<script src="../assets/brands.js"></script>
<script>
const ICON_COLOR = "#222222";
function roundRect(c,x,y,w,h,r){c.beginPath();c.moveTo(x+r,y);c.arcTo(x+w,y,x+w,y+h,r);c.arcTo(x+w,y+h,x,y+h,r);c.arcTo(x,y+h,x,y,r);c.arcTo(x,y,x+w,y,r);c.closePath();}
function drawIcon(x,S,path){
  const ring=Math.round(S*0.07);
  roundRect(x,0,0,S,S,S*0.26); x.fillStyle="#ffffff"; x.fill();
  roundRect(x,ring,ring,S-2*ring,S-2*ring,(S-2*ring)*0.22); x.fillStyle=ICON_COLOR; x.fill();
  const pad=ring+(S-2*ring)*0.2, s=(S-2*pad)/24; x.save(); x.translate(pad,pad); x.scale(s,s);
  x.fillStyle="#fff"; x.fill(new Path2D(path)); x.restore();
}
const out = document.getElementById("out");
for (const [key, b] of Object.entries(window.BRANDS)) {
  const c = document.createElement("canvas"); c.width = c.height = 96;
  drawIcon(c.getContext("2d"), 96, b.path);
  const url = c.toDataURL("image/png");
  const row = document.createElement("div");
  row.innerHTML = `<img src="${url}" width="48"> <a download="${key}.png" href="${url}">${key}.png</a>`;
  row.dataset.key = key; row.dataset.png = url;
  out.appendChild(row);
}
</script>
